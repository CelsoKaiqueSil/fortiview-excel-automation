[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fortiview-excel-automation"
version = "1.0.0"
description = "Automação sintética para normalizar tráfego, criar backup e atualizar Excel."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
fortiview-excel = "fortiview_excel.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
